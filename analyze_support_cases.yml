---
- name: Analyze Red Hat Support Cases with AI
  hosts: localhost
  gather_facts: yes
  
  vars:
    # Required values
    # support_case_account_ids: ['1024286']
    # support_case_account_name: Parasol

    # Default values that can be overridden with -e
    analysis_file_dest: "{{ default_analysis_file_dest }}"
    case_status_filter: "{{ default_case_status }}"
    support_case_products: "{{ default_support_case_products }}"
    secure_logging: true
    
  tasks:
    - name: Check API credentials
      ansible.builtin.assert:
        that:
          - redhat_offline_token is defined
          - redhat_offline_token | length > 0
          - llm_api_key is defined
          - llm_api_key | length > 0
          - llm_api_base_url is defined
          - llm_api_base_url | length > 0
        fail_msg: |
          API credentials not configured. Please either:
          1. Set environment variables: REDHAT_OFFLINE_TOKEN, LLM_API_KEY, LLM_API_BASE_URL
          2. Or configure group_vars/all/vault.yml with encrypted credentials
          
          To get your Red Hat offline token:
          - Visit https://access.redhat.com/management/api
          - Click "Generate Token" to get an offline token
          - This offline token will be exchanged for an access token via Red Hat SSO
          
          For LLM configuration:
          - Local vLLM: Use LLM_API_KEY="EMPTY" and LLM_API_BASE_URL="http://localhost:8000/v1"
          - Ollama: Use LLM_API_KEY="EMPTY" and LLM_API_BASE_URL="http://localhost:11434/v1"
          - OpenAI: Use your API key and LLM_API_BASE_URL="https://api.openai.com/v1"
        success_msg: "API credentials validated"
      tags: [always]

    - name: Ensure reports directory exists
      ansible.builtin.file:
        path: "{{ analysis_file_dest | dirname }}"
        state: directory
        mode: '0755'
      tags: [always]

    - name: Exchange offline token for access token via Red Hat SSO
      ansible.builtin.uri:
        url: "{{ redhat_sso_url }}"
        method: POST
        body_format: form-urlencoded
        body:
          grant_type: refresh_token
          client_id: rhsm-api
          refresh_token: "{{ redhat_offline_token }}"
        status_code: 200
        timeout: 30
      register: r_sso_token
      no_log: "{{ secure_logging }}"
      tags: [always, auth]

    - name: Set access token from SSO response
      ansible.builtin.set_fact:
        redhat_access_token: "{{ r_sso_token.json.access_token }}"
      no_log: "{{ secure_logging }}"
      tags: [always, auth]

    - name: Fetch support cases for each customer account
      loop: "{{ support_case_account_ids }}"
      loop_control:
        loop_var: account_id
        label: "Account {{ account_id }}"
      ansible.builtin.uri:
        url: "{{ redhat_api_base_url }}/cases/filter"
        method: POST
        body:
          accountNumber: "{{ account_id }}"
        headers:
          Accept: "application/json"
          Authorization: "Bearer {{ redhat_access_token }}"
        body_format: json
        status_code: [200, 201]
        timeout: "{{ redhat_api_timeout }}"
      register: r_support_cases
      ignore_errors: yes
      tags: [fetch]

    - name: Extract cases from API response
      ansible.builtin.set_fact:
        all_cases: "{{ r_support_cases.results | map(attribute='json.cases') | flatten | list }}"
      tags: [filter]

    - name: Generate base report from template
      register: r_base_report
      ansible.builtin.template:
        src: templates/report.md.j2
        dest: "{{ analysis_file_dest }}.md.tmp"
        mode: '0644'
      tags: [report]

    - name: Prepare case data for LLM AI
      ansible.builtin.set_fact:
        llm_case_data:
          total_cases: "{{ all_cases | length }}"
          account_name: "{{ support_case_account_name }}"
          accounts: "{{ support_case_account_ids }}"
          cases: "{{ all_cases }}"
      tags: [ai]

    - name: Generate AI summary with LLM
      llm_summarize:
        api_key: "{{ llm_api_key }}"
        api_base_url: "{{ llm_api_base_url }}"
        case_data: "{{ llm_case_data }}"
        model: "{{ llm_model }}"
        temperature: "{{ llm_temperature }}"
        max_tokens: "{{ llm_max_tokens }}"
        timeout: "{{ llm_timeout }}"
      register: ai_analysis
      when: all_cases | length > 0
      tags: [ai]

    - name: Set AI summary variable
      ansible.builtin.set_fact:
        ai_summary: "{{ ai_analysis.summary | default('*No AI summary available - no cases found or AI analysis failed*') }}"
      tags: [ai]

    - name: Generate final report with AI insights
      ansible.builtin.template:
        src: templates/report.md.j2
        dest: "{{ analysis_file_dest }}.md"
        mode: '0644'
      tags: [report,ai]

    - name: Clean up temporary file
      when: r_base_report is success
      ansible.builtin.file:
        path: "{{ r_base_report.dest }}"
        state: absent
      tags: [report,ai]

    - name: Display summary
      ansible.builtin.debug:
        msg:
          - "============================================"
          - "Support Case Analysis Complete!"
          - "============================================"
          - "Total Cases Analyzed: {{ all_cases | length }}"
          - "Customer Accounts: {{ support_case_account_ids | length }}"
          - "Report Generated: {{ analysis_file_dest }}"
          - "AI Analysis: {{ 'Completed' if ai_analysis.summary is defined else 'Skipped' }}"
          - "============================================"
      tags: [always,ai]

    - name: Generate PDF report
      block:
        - name: Convert markdown to HTML
          ansible.builtin.command:
            cmd: "pandoc --standalone -c ~/.pandoc/github-md.css -f gfm {{ analysis_file_dest }}.md -o {{ analysis_file_dest }}.html"
          tags: [report,ai]

        - name: Convert HTML to PDF
          ansible.builtin.command:
            cmd: "weasyprint -q {{ analysis_file_dest }}.html {{ analysis_file_dest }}.pdf"
          tags: [report,ai]
