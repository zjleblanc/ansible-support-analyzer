---
# Ansible Automation Platform custom credential type definitions for this project.
#
# Consumed as a `controller_credential_types` list (see
# https://github.com/zjleblanc/ansible-cac/blob/main/config/common/credential_types.yml
# for the convention this follows) so these can be applied to a controller via
# infra.controller_configuration or a similar CaC pipeline.
#
# - "Ansible Support Analyzer": Red Hat, LLM, and Google Sheets credentials shared by
#   both analyze_support_cases.yml and track_support_cases.yml. Each playbook's job
#   template attaches its own separate Credential instance of this type (e.g. the
#   analyze job template overrides gsheet_sheet to "Accounts"; the tracker job
#   template uses the default "Support Case Tracker").
# - "SMTP Server": Used only by track_support_cases.yml's change-notification email.
#   Copied here from ansible-cac so this repo is self-contained; keep in sync with
#   https://github.com/zjleblanc/ansible-cac/blob/main/config/common/credential_types.yml
#   if that definition changes.
controller_credential_types:
  - name: Ansible Support Analyzer
    organization: Autodotes
    description: >-
      API tokens, LLM endpoint settings, and Google Sheets credentials shared by
      analyze_support_cases.yml and track_support_cases.yml. Writes the service
      account key to a temp file and sets GOOGLE_SA_CRED_PATH for the gsheet_update
      and gsheet_tracker modules. Attach a separate Credential of this type to each
      job template (analyze vs. track) so gsheet_sheet can differ per playbook; the
      tracker job template also needs an "SMTP Server" credential for notifications.
    kind: cloud
    inputs:
      fields:
        - id: redhat_offline_token
          type: string
          label: Red Hat offline token
          secret: true
          help_text: >-
            Offline token from https://access.redhat.com/management/api
        - id: llm_api_key
          type: string
          label: LLM API key
          secret: true
          help_text: >-
            Use EMPTY for local OpenAI-compatible servers without auth
        - id: llm_api_base_url
          type: string
          label: LLM API base URL
          help_text: >-
            e.g. https://api.openai.com/v1 or http://localhost:8000/v1
        - id: llm_model
          type: string
          label: LLM model name
          help_text: Model identifier for llm_summarize (maps to LLM_MODEL).
        - id: google_service_account_json
          type: string
          label: Google service account JSON
          secret: true
          multiline: true
          help_text: >-
            Full contents of the service account key file. Materialized at job
            runtime; path exposed as GOOGLE_SA_CRED_PATH for gsheet_update.
        - id: google_sheet_id
          type: string
          label: Google spreadsheet ID
          help_text: Spreadsheet ID from the Google Sheets URL
        - id: gsheet_sheet
          type: string
          label: Default worksheet name
          default: Support Case Tracker
          help_text: >-
            Default worksheet tab name. Set to "Accounts" on the Credential attached
            to the analyze_support_cases.yml job template; leave as the default
            ("Support Case Tracker") on the Credential attached to the
            track_support_cases.yml job template.
        - id: gsheet_lookup_column
          type: string
          label: Default lookup column
          help_text: Column letter to find the account row (used by analyze_support_cases.yml only).
        - id: gsheet_update_column
          type: string
          label: Default update column
          help_text: Column letter for the JSON report payload (used by analyze_support_cases.yml only).
      required:
        - redhat_offline_token
        - llm_api_key
        - llm_api_base_url
        - llm_model
        - google_service_account_json
        - google_sheet_id
    injectors:
      env:
        REDHAT_OFFLINE_TOKEN: !unsafe "{{ redhat_offline_token }}"
        LLM_API_KEY: !unsafe "{{ llm_api_key }}"
        LLM_API_BASE_URL: !unsafe "{{ llm_api_base_url }}"
        LLM_MODEL: !unsafe "{{ llm_model }}"
        GOOGLE_SA_CRED_PATH: !unsafe "{{ tower.filename }}"
        GOOGLE_SHEET_ID: !unsafe "{{ google_sheet_id }}"
        GSHEET_SHEET: !unsafe "{{ gsheet_sheet }}"
        GSHEET_LOOKUP_COLUMN: !unsafe "{{ gsheet_lookup_column }}"
        GSHEET_UPDATE_COLUMN: !unsafe "{{ gsheet_update_column }}"
      file:
        template: !unsafe "{{ google_service_account_json }}"

  - name: SMTP Server
    organization: Autodotes
    description: >-
      For use with community.general.mail to send e-mail notifications. Used by
      track_support_cases.yml for change-notification emails. Mirrored from
      https://github.com/zjleblanc/ansible-cac/blob/main/config/common/credential_types.yml
    kind: cloud
    inputs:
      fields:
        - id: email_smtp_server
          label: Server
          type: string
          help_text: Example - smtp.gmail.com
        - id: email_smtp_server_port
          label: Port
          type: string
          help_text: Example - 587
        - id: email_smtp_username
          label: Username
          type: string
          help_text: Username to authenticate with SMTP server
        - id: email_smtp_password
          label: Password
          type: string
          secret: true
          help_text: Password to authenticate with SMTP server
        - id: email_smtp_from_address
          label: From Address
          type: string
          help_text: Example - sender@gmail.com
      required:
        - email_smtp_server
        - email_smtp_server_port
        - email_smtp_username
        - email_smtp_password
        - email_smtp_from_address
    injectors:
      extra_vars:
        MAILHOST: !unsafe "{{ email_smtp_server }}"
        MAILHOST_PASSWORD: !unsafe "{{ email_smtp_password }}"
        MAILHOST_PORT: !unsafe "{{ email_smtp_server_port }}"
        MAILHOST_USERNAME: !unsafe "{{ email_smtp_username }}"
        email_smtp_from_address: !unsafe "{{ email_smtp_from_address }}"
        email_smtp_password: !unsafe "{{ email_smtp_password }}"
        email_smtp_server: !unsafe "{{ email_smtp_server }}"
        email_smtp_server_port: !unsafe "{{ email_smtp_server_port }}"
        email_smtp_username: !unsafe "{{ email_smtp_username }}"
        smtp_password: !unsafe "{{ email_smtp_password }}"
        smtp_port: !unsafe "{{ email_smtp_server_port }}"
        smtp_username: !unsafe "{{ email_smtp_username }}"
        smtpserver: !unsafe "{{ email_smtp_server }}"
