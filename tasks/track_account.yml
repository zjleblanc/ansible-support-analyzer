---
- name: Set variables for current account | {{ account.name }}
  ansible.builtin.set_fact:
    support_case_account_name: "{{ account.name }}"
    support_case_account_ids: "{{ account.ids }}"
    activity_date: "{{ account.activity_date | default(activity_date) }}"
  tags: [always]

- name: Read previous tracker state for last-run timestamp | {{ account.name }}
  gsheet_tracker:
    state: read
    gsheet_id: "{{ gsheet_id | default(omit) }}"
    sheet: "{{ gsheet_sheet }}"
    account_name: "{{ support_case_account_name }}"
  register: r_tracker_prev
  tags: [always, fetch]

- name: Determine effective last-modified cutoff | {{ account.name }}
  vars:
    _sheet_ts: "{{ r_tracker_prev.last_seen_timestamp | default('', true) }}"
    _override: "{{ tracker_last_run_date | default('', true) }}"
    _fallback: "{{ activity_date }}T00:00:00Z"
  ansible.builtin.set_fact:
    _effective_last_modified_since: >-
      {{ _override if (_override | length > 0) else (_sheet_ts if (_sheet_ts | length > 0) else _fallback) }}
  tags: [always, fetch]

- name: Fetch support cases via GraphQL | {{ account.name }}
  graphql_cases:
    access_token: "{{ redhat_access_token }}"
    graphql_url: "{{ redhat_graphql_url }}"
    client_name: "{{ redhat_graphql_client_name }}"
    client_version: "{{ redhat_graphql_client_version }}"
    account_numbers: "{{ support_case_account_ids }}"
    last_modified_since: "{{ _effective_last_modified_since | trim }}"
    include_description: false
    page_size: "{{ redhat_graphql_page_size }}"
    timeout: "{{ redhat_api_timeout }}"
  register: r_support_cases
  tags: [always, fetch]

- name: Set all_cases from GraphQL response | {{ account.name }}
  ansible.builtin.set_fact:
    all_cases: "{{ r_support_cases.cases | default([], true) }}"
  tags: [always, fetch]

- name: Note when no cases match filters | {{ account.name }}
  when: all_cases | length == 0
  ansible.builtin.debug:
    msg: >-
      No support cases with activity since {{ _effective_last_modified_since | trim }}
      for {{ support_case_account_name }}.
      The tracker will record zero active cases, which may surface prior cases as "closed".
  tags: [always, filter]

- name: Normalize cases for the tracker | {{ account.name }}
  vars:
    tracker_case_projection: >-
      [].{case_id: caseNumber, summary: summary, product: product, severity: severity,
      status: status, owner: owner, created: createdDate, last_modified: lastModifiedDate}
  ansible.builtin.set_fact:
    tracked_cases: "{{ all_cases | json_query(tracker_case_projection) | default([], true) }}"
  tags: [always]

- name: Record active cases and compute diff since last run | {{ account.name }}
  gsheet_tracker:
    gsheet_id: "{{ gsheet_id | default(omit) }}"
    sheet: "{{ gsheet_sheet }}"
    account_name: "{{ support_case_account_name }}"
    cases: "{{ tracked_cases }}"
  register: r_gsheet_tracker
  tags: [always]

- name: Build tracking entry | {{ account.name }}
  ansible.builtin.set_fact:
    _tracking_entry:
      account: "{{ support_case_account_name }}"
      total_current: "{{ r_gsheet_tracker.total_current }}"
      total_previous: "{{ r_gsheet_tracker.total_previous }}"
      has_changes: "{{ r_gsheet_tracker.has_changes }}"
      new_cases: "{{ r_gsheet_tracker.new_cases }}"
      closed_cases: "{{ r_gsheet_tracker.closed_cases }}"
      updated_cases: "{{ r_gsheet_tracker.updated_cases }}"
  tags: [always]

- name: Accumulate tracking results across accounts | {{ account.name }}
  ansible.builtin.set_fact:
    tracking_results: "{{ (tracking_results | default([])) + [_tracking_entry] }}"
  tags: [always]

- name: Display tracking summary | {{ account.name }}
  ansible.builtin.debug:
    msg:
      - "============================================"
      - "Support Case Tracking Complete!"
      - "============================================"
      - "Account: {{ support_case_account_name }}"
      - "Active Cases: {{ r_gsheet_tracker.total_current }} (previously: {{ r_gsheet_tracker.total_previous }})"
      - "New: {{ r_gsheet_tracker.new_cases | length }} | Closed: {{ r_gsheet_tracker.closed_cases | length }}
        | Updated: {{ r_gsheet_tracker.updated_cases | length }}"
      - "============================================"
  tags: [always]
